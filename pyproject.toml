[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gguf-guard"
version = "0.1.0"
description = "Inspect GGUF model files before you run them: structure checks, chat-template injection checks, provenance metadata, and per-tensor integrity manifests and diffs. No dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ravirajsinh Padhiar" }]
keywords = ["gguf", "llm-security", "model-supply-chain", "llama.cpp", "ollama", "ai-security", "integrity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "gguf>=0.10", "numpy", "mcp>=1.2"]

[project.scripts]
gguf-guard = "gguf_guard.cli:main"

[project.urls]
Homepage = "https://github.com/ravirajsinhpadhiar/gguf-guard"

[tool.hatch.build.targets.wheel]
packages = ["src/gguf_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
